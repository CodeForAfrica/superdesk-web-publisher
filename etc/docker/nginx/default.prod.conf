# Production server config. Unlike the dev default.conf (which the local
# start-script rewrites at boot), this bakes the two production concerns in:
#   - fastcgi_pass points at the co-located php container by its ECS task link
#     name "publisher-php" (the app task names the php container publisher-php).
#   - client_max_body_size 100m so Superdesk's media push (/api/v2/assets/push)
#     is not rejected with 413.
# HTTP_HOST is passed through unchanged so SWP resolves the tenant from the real
# request host (publisher.<domain>).
server {
    listen 80;
    server_name _;
    root /var/www/publisher/public;

    client_max_body_size 100m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass publisher-php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_HOST $http_host;
        internal;
    }

    # Never execute any other .php file directly.
    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/publisher_error.log;
    access_log /var/log/nginx/publisher_access.log;
}
