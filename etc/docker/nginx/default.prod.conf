# Production server config, rendered by the stock nginx entrypoint's envsubst
# step (Dockerfile.prod copies this to /etc/nginx/templates/default.conf.template,
# so ${PUBLISHER_TENANT_HOST} is substituted into /etc/nginx/conf.d/default.conf
# at container start). NGINX_ENVSUBST_FILTER=^PUBLISHER_ keeps envsubst off
# nginx's own $-variables. Unlike the dev default.conf (which the local
# start-script rewrites at boot), this bakes the production concerns in:
#   - fastcgi_pass points at the co-located php container by its ECS task link
#     name "publisher-php" (the app task names the php container publisher-php).
#   - client_max_body_size 100m so Superdesk's media push (/api/v2/assets/push)
#     is not rejected with 413.
#   - HTTP_HOST rewrite for in-VPC service-to-service pushes. Superdesk's
#     http_push reaches Publisher through the internal ALB with Host
#     publisher.<env>.internal, which is NOT an SWP tenant domain. SWP resolves
#     the tenant from HTTP_HOST, so passed through unchanged EVERY push 404s
#     ("Tenant for host ... could not be found"), the publish_queue item goes to
#     state=error and nothing is delivered. Rewrite HTTP_HOST for any in-VPC
#     *.internal host to the real tenant host (PUBLISHER_TENANT_HOST, e.g.
#     publisher-staging.pesacheck.org) so the tenant resolves. Browser traffic
#     arrives on the public tenant host and is passed through unchanged. This
#     mirrors the local dev start-script's publisher-nginx -> localhost rewrite.
server {
    listen 80;
    server_name _;
    root /var/www/publisher/public;

    client_max_body_size 100m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass publisher-php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        # Default: keep the request host (public tenant host from the browser).
        set $publisher_fastcgi_host $http_host;
        # In-VPC pushes arrive on publisher.<env>.internal -> map to the tenant host.
        if ($http_host ~ "\.internal$") {
            set $publisher_fastcgi_host "${PUBLISHER_TENANT_HOST}";
        }
        fastcgi_param HTTP_HOST $publisher_fastcgi_host;
        internal;
    }

    # Never execute any other .php file directly.
    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/publisher_error.log;
    access_log /var/log/nginx/publisher_access.log;
}
