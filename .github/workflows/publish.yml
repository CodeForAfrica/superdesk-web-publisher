name: Publish staging PHP 8.3 images
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [php, websocket]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Build, validate and publish staging tag only
        env:
          IMAGE: codeforafrica/superdesk-web-publisher-${{ matrix.image }}
          TAG: ${{ inputs.tag }}
        run: |
          docker build --platform linux/amd64 --target '${{ matrix.image }}' -f etc/docker/php83-runtime/Dockerfile -t "$IMAGE:$TAG" .
          docker run --rm --network none --entrypoint php "$IMAGE:$TAG" -r 'if (PHP_VERSION !== "8.3.36") exit(1); echo PHP_VERSION, PHP_EOL;'
          docker run --rm --network none --entrypoint php "$IMAGE:$TAG" /usr/bin/composer check-platform-reqs --lock --no-dev
          docker run --rm --network none --entrypoint php "$IMAGE:$TAG" bin/console about --env=prod --no-debug
          docker push "$IMAGE:$TAG"
