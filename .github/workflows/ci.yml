name: CI

on:
  push:
    branches: [pesacheck]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/pesacheck' }}

env:
  APP_ENV: test
  COMPOSER_ROOT_VERSION: "dev-master"
  NODE_VERSION: "18"

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }} | ${{ matrix.doctrine_cache_driver }} cache)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.0"
            doctrine_cache_driver: memcached
          - php: "8.0"
            doctrine_cache_driver: array

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432/tcp
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

      memcached:
        image: memcached:1.6
        ports:
          - 11211:11211

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.10.1
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd "curl -fsS http://localhost:9200 >/dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          coverage: none
          extensions: json,memcached,amqp,pdo_sqlite,pgsql,mbstring,xml,ctype,iconv,intl
          ini-values: memory_limit=-1, post_max_size=100M, upload_max_filesize=100M
          php-version: ${{ matrix.php }}
          tools: pecl

      - name: Display versions
        run: |
          php --version
          composer --version
          php -r 'foreach (get_loaded_extensions() as $extension) echo $extension . " " . phpversion($extension) . PHP_EOL;'

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "directory=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --ansi --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache test API NPM packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-test-api-${{ hashFiles('src/SWP/Bundle/CoreBundle/Tests/Functional/Resources/package.json') }}
          restore-keys: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-test-api-

      - name: Install test API dependencies
        run: npm install --no-progress --package-lock=false
        working-directory: src/SWP/Bundle/CoreBundle/Tests/Functional/Resources

      - name: Start test API
        run: nohup node server.js &
        working-directory: src/SWP/Bundle/CoreBundle/Tests/Functional/Resources

      - name: Test loading fixtures from dev env in test env
        run: |
          echo "::group::database schema update"
          php bin/console doctrine:schema:update -f --env=test
          echo "::endgroup::"
          echo "::group::load fixtures"
          php bin/console doctrine:fixtures:load --env=test --no-interaction
          echo "::endgroup::"
        env:
          FIXTURES_TYPE: dev
          WEBP_CONVERSION_ENABLED: false
          DOCTRINE_CACHE_DRIVER: ${{ matrix.doctrine_cache_driver }}

      - name: Test migrations on Postgres
        run: php bin/console doctrine:migrations:migrate --env=test --no-debug -vvv
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres?charset=UTF-8
          DOCTRINE_CACHE_DRIVER: ${{ matrix.doctrine_cache_driver }}

      - name: Populate Elasticsearch index
        run: |
          curl -fsS -XDELETE http://127.0.0.1:9200/swp_index-test || true
          php bin/console fos:elastica:populate --env=test
        env:
          DOCTRINE_CACHE_DRIVER: ${{ matrix.doctrine_cache_driver }}

      - name: Run PHPUnit tests
        run: |
          echo "::group::phpunit stderr"
          bin/phpunit --stderr src/SWP/Bundle/CoreBundle/Tests/Security/Storage/DynamicDomainSessionStorageTest.php
          bin/phpunit --stderr src/SWP/Bundle/CoreBundle/Tests/Controller/AuthControllerTest.php
          bin/phpunit --stderr src/SWP/Bundle/CoreBundle/Tests/Controller/RegistrationControllerTest.php
          echo "::endgroup::"
          echo "::group::phpunit run"
          bin/phpunit
          echo "::endgroup::"
        env:
          DOCTRINE_CACHE_DRIVER: ${{ matrix.doctrine_cache_driver }}
