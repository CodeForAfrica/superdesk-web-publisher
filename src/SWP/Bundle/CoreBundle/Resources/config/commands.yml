services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            $messageBus: '@messenger.default_bus'
            $filesystem: '@oneup_flysystem.swp_filesystem_filesystem'

    SWP\Component\MultiTenancy\Context\TenantContextInterface: '@swp_multi_tenancy.tenant_context'
    SWP\Bundle\BridgeBundle\Doctrine\ORM\PackageRepository: '@swp.repository.package'

    SWP\Bundle\CoreBundle\Command\CreateUserCommand:
        arguments:
            - '@SWP\Bundle\UserBundle\Util\UserManipulator'

    SWP\Bundle\CoreBundle\Command\ImportUserCommand:
        arguments:
            - '@SWP\Bundle\UserBundle\Util\UserManipulator'

    # Explicit wiring: the three theme generators share GeneratorInterface, so
    # they cannot be autowired by type. See LoadTenantConfigCommand's docblock.
    SWP\Bundle\CoreBundle\Command\LoadTenantConfigCommand:
        arguments:
            - '@swp.repository.tenant'
            - '@swp_multi_tenancy.tenant_context'
            - '@swp_core.generator.theme.routes'
            - '@swp_core.generator.theme.menus'
            - '@swp_core.generator.theme.content_lists'
            - '@swp.provider.route'
            - '@swp.repository.rule'
            - '@swp.factory.rule'
            - '@swp_settings.manager.settings'
        tags:
            - { name: console.command }

    SWP\Bundle\CoreBundle\Command\SeedContentListItemsCommand:
        arguments:
            - '@swp.repository.tenant'
            - '@swp_multi_tenancy.tenant_context'
            - '@swp.repository.content_list'
            - '@swp.repository.content_list_item'
            - '@swp.repository.article'
            - '@swp.service.content_list'
        tags:
            - { name: console.command }

    SWP\Bundle\CoreBundle\Command\:
        resource: '../../Command/*'
        exclude: '../../Command/{CreateUserCommand,ImportUserCommand,LoadTenantConfigCommand,SeedContentListItemsCommand}.php'
